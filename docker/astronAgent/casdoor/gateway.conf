map $http_x_forwarded_proto $casdoor_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

map $http_upgrade $casdoor_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8000;
    server_name _;
    # Preserve Casdoor's own upload validation rather than adding nginx's 1 MiB limit.
    client_max_body_size 0;
    location / {
        proxy_pass http://casdoor:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $casdoor_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $casdoor_connection_upgrade;
    }
}
