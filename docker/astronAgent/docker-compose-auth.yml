x-casdoor-password-tool: &casdoor-password-tool
  build: ./casdoor/password-storage
  image: astron-agent-casdoor-passwords:local
  environment:
    CASDOOR_MIGRATION_DB_HOST: casdoor-mysql
    CASDOOR_MIGRATION_DB_USER: casdoor
    CASDOOR_MIGRATION_DB_PASSWORD: "${CASDOOR_MYSQL_PASSWORD:-casdoor123}"
  networks:
    - astron-agent-network
  depends_on:
    casdoor-mysql:
      condition: service_healthy

services:
  casdoor:
    image: casbin/casdoor:v2.67.0
    container_name: astron-agent-casdoor
    restart: always
    user: root
    # Public access is provided only by the verified gateway below.
    environment:
      - GIN_MODE=release
      - CONSOLE_DOMAIN=${CONSOLE_DOMAIN:-http://localhost}
      - HOST_BASE_ADDRESS=${HOST_BASE_ADDRESS:-http://localhost}
      - origin=${CONSOLE_CASDOOR_URL:-http://localhost:8000}
      - originFrontend=${CONSOLE_CASDOOR_URL:-http://localhost:8000}
    volumes:
      - ./casdoor/conf:/conf-templates:ro
      - ./casdoor/entrypoint.sh:/entrypoint.sh:ro
      - casdoor-logs:/logs
    networks:
      - astron-agent-network
    depends_on:
      - casdoor-mysql
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  # Read-only verification never converts passwords automatically. On a fresh
  # database it blocks publication until the explicit migration has been run.
  casdoor-password-check:
    <<: *casdoor-password-tool
    command: ["--check", "--wait-url", "http://casdoor:8000/"]
    depends_on:
      casdoor:
        condition: service_started
      casdoor-mysql:
        condition: service_healthy

  casdoor-gateway:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "${CASDOOR_BIND_ADDRESS:-0.0.0.0}:${CASDOOR_PORT:-8000}:8000"
    volumes:
      - ./casdoor/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - astron-agent-network
    depends_on:
      casdoor-password-check:
        condition: service_completed_successfully

  # Explicit operator action only: docker compose ... run --rm casdoor-passwords
  casdoor-passwords:
    <<: *casdoor-password-tool
    profiles: [maintenance]

  casdoor-mysql:
    image: mysql:8.4.6
    container_name: astron-agent-casdoor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: casdoor
      MYSQL_USER: casdoor
      MYSQL_PASSWORD: "${CASDOOR_MYSQL_PASSWORD:-casdoor123}"
    volumes:
      - casdoor-mysql-data:/var/lib/mysql
    networks:
      - astron-agent-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

# ============================================================================
# Network Configuration
# ============================================================================
networks:
  astron-agent-network:
    driver: bridge

volumes:
  casdoor-logs:
  casdoor-mysql-data:
