name: Cryptographic configuration
on:
  pull_request:
    paths:
      - 'docker/astronAgent/casdoor/**'
      - '.github/workflows/crypto-config.yml'
  push:
    branches: [main, 'fix/crypto-security-evidence']
    paths:
      - 'docker/astronAgent/casdoor/**'
      - '.github/workflows/crypto-config.yml'
permissions:
  contents: read
jobs:
  certificate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate certificate initialization configuration
        run: python3 docker/astronAgent/casdoor/test_certificate_config.py
